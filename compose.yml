services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: newsletter-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./templates:/app/templates
      - ./MANUAL.md:/app/MANUAL.md
      - ./drafts:/data/drafts
      - ./recipients:/data/recipients
    depends_on:
      - mailhog
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: newsletter-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  mailhog:
    image: mailhog/mailhog:latest
    container_name: newsletter-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
